name: Deploy to Cloudflare

# Job `build` runs Gradle, npm and the tests and produces the static site; it never sees a secret.
# Job `deploy` only checks out the sources, downloads the site, installs the lockfile-pinned
# dependencies without running any install scripts, and runs Wrangler with the Cloudflare secrets.
# Repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit), CLOUDFLARE_ACCOUNT_ID.
# Optional repository variable: COOP_PUBLIC_ORIGIN (e.g. https://co-op-pixel-dungeon.<subdomain>.workers.dev)
# enables the post-deploy smoke check.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'kimyc3825/Co-Op-Pixel-Dungeon' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COOP_CLIENT_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install, typecheck and test the server
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test
      # The most recently deployed site; its versioned folders (see play/generations.json) are kept
      # for a few more deploys so pages opened earlier can still load their files.
      - name: Restore the last deployed site
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: previous-site
          key: cloudflare-site-none
          restore-keys: cloudflare-site-
      - name: Build the dungeon and stage the site
        run: |
          ./gradlew -PwebOnly html:dist
          if [[ -d previous-site/play ]]; then export COOP_PREVIOUS_SITE="$PWD/previous-site"; fi
          node scripts/stage-web-client.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: server/public
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COOP_CLIENT_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      # Wrangler and its dependencies exactly as in server/package-lock.json; no package scripts run.
      - name: Install Wrangler from the lockfile
        working-directory: server
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: server/public
      - name: Skip if main has moved on
        id: current
        run: |
          main_ref="$(git ls-remote --exit-code origin refs/heads/main)"
          read -r main_revision _ <<< "$main_ref"
          if [[ "$main_revision" != "$COOP_CLIENT_REVISION" ]]; then
            echo "Skipping revision $COOP_CLIENT_REVISION because main has advanced to $main_revision."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy with Wrangler
        if: steps.current.outputs.deploy == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy
      - name: Keep this site for the next deploy
        if: steps.current.outputs.deploy == 'true'
        run: cp -r server/public previous-site
      - name: Save this site
        if: steps.current.outputs.deploy == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: previous-site
          key: cloudflare-site-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Smoke check
        if: steps.current.outputs.deploy == 'true' && vars.COOP_PUBLIC_ORIGIN != ''
        env:
          ORIGIN: ${{ vars.COOP_PUBLIC_ORIGIN }}
        # A new deployment takes a few seconds to reach every location; retry for about a minute.
        run: |
          check() {
            curl --fail --silent --show-error "$ORIGIN/api/v5/health" > /dev/null || return 1
            curl --fail --silent --show-error "$ORIGIN/play/original/manifest.json" > /dev/null || return 1
            page="$(curl --fail --silent --show-error "$ORIGIN/play/")" || return 1
            base="$(grep -o '<base href="/play/client/[^"]*"' <<< "$page" | cut -d'"' -f2)"
            [[ "$base" == /play/client/"$COOP_CLIENT_REVISION"-* ]] || { echo "Lobby base is still: $base"; return 1; }
            curl --fail --silent --show-error "$ORIGIN${base}main.mjs" > /dev/null
          }
          for attempt in $(seq 1 12); do
            if check; then echo "Smoke check passed."; exit 0; fi
            sleep 5
          done
          echo "Smoke check failed after 12 attempts."
          exit 1
