name: Claude

# 이슈나 풀 리퀘스트에 "@claude"가 들어간 댓글·리뷰를 쓰면 Claude Code가 실행됩니다.
# 저장소에 쓰기 권한이 있는 사람이 부른 경우에만 동작합니다(액션이 확인).
# Claude는 AGENTS.md를 따르므로 `claude/<주제>` 브랜치에 커밋하고 main에는 푸시하지 않습니다.
# 필요한 것: Claude GitHub 앱 설치(https://github.com/apps/claude)와 저장소 비밀 값
# ANTHROPIC_API_KEY 또는 CLAUDE_CODE_OAUTH_TOKEN 중 하나.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      github.repository == 'kimyc3825/Co-Op-Pixel-Dungeon' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # 풀 리퀘스트의 CI 결과를 읽기 위해
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
