<html lang="ko">
<head>
<meta charset="utf-8">
	<title>Noxac Pixel Dungeon · 원본 모드</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Shattered Pixel Dungeon, a traditional roguelike game with pixel-art graphics and simple interface, playable in the browser.">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shattered PD">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon_32.png">
<link rel="icon" type="image/png" sizes="128x128" href="icons/icon_128.png">
<link rel="apple-touch-icon" href="icons/icon_256.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
	:root {
		--bg: #000;
		--fg: #e6e1d6;
		--muted: #8f8a7f;
		--accent: #ffcc33;
		--bar-bg: #2a2722;
		--danger: #ff6a5a;
	}
	html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		background: var(--bg);
		color: var(--fg);
		overflow: hidden;
		overscroll-behavior: none;
		-webkit-user-select: none;
		user-select: none;
		-webkit-touch-callout: none;
		-webkit-tap-highlight-color: transparent;
		font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
	}
	#canvas {
		position: fixed;
		left: 0;
		top: 0;
		display: block;
		border: none;
		outline: none;
		touch-action: none;
		image-rendering: pixelated;
	}
	.overlay {
		position: fixed;
		inset: 0;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 16px;
		padding: 16px;
		box-sizing: border-box;
		background: var(--bg);
		text-align: center;
		z-index: 10;
	}
	.hidden { display: none !important; }
	#loader img {
		width: 128px;
		height: 128px;
		image-rendering: pixelated;
	}
	.title { font-size: 22px; letter-spacing: 1px; color: var(--accent); }
	#bar {
		width: min(420px, 80vw);
		height: 12px;
		background: var(--bar-bg);
		border: 2px solid #4a463e;
		box-sizing: content-box;
	}
	#bar > div {
		width: 0%;
		height: 100%;
		background: var(--accent);
		transition: width 120ms linear;
	}
	#status { font-size: 14px; color: var(--muted); min-height: 1.2em; }
	.credits { font-size: 12px; color: var(--muted); line-height: 1.6; max-width: 560px; }
	.credits a { color: var(--fg); }
	#crash pre {
		max-width: min(900px, 100%);
		max-height: 50vh;
		overflow: auto;
		text-align: left;
		font-size: 12px;
		background: #15130f;
		border: 1px solid #3a362e;
		padding: 12px;
		white-space: pre-wrap;
		word-break: break-word;
		-webkit-user-select: text;
		user-select: text;
	}
	#crash h1, #closed h1 { font-size: 20px; margin: 0; }
	#crash h1 { color: var(--danger); }
	button {
		font: inherit;
		font-size: 15px;
		color: var(--bg);
		background: var(--accent);
		border: none;
		padding: 10px 18px;
		cursor: pointer;
	}
	button.secondary { background: var(--bar-bg); color: var(--fg); }
	.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
	/* hidden text field that brings up the on-screen keyboard on touch devices */
	#kb {
		position: fixed;
		left: 0;
		bottom: 0;
		width: 1px;
		height: 1px;
		opacity: 0;
		border: 0;
		padding: 0;
		font-size: 16px; /* prevents iOS from zooming in when focused */
		pointer-events: none;
		z-index: -1;
	}
	/* measures env(safe-area-inset-*) for the game (notches, home indicator) */
	#insets {
		position: fixed;
		inset: 0;
		visibility: hidden;
		pointer-events: none;
		padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
	}
	noscript { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<div id="insets"></div>
<textarea id="kb" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-hidden="true"></textarea>

<div id="loader" class="overlay">
	<img id="logo" src="icons/icon_128.png" alt="" width="128" height="128">
	<div class="title">Noxac Pixel Dungeon · 원본 모드</div>
	<div id="bar"><div></div></div>
	<div id="status">던전 불러오는 중…</div>
	<div class="credits">
		Shattered Pixel Dungeon by Evan Debenham, based on Pixel Dungeon by Watabou.<br>
		Free software under the <a href="LICENSE.txt" target="_blank" rel="noopener">GNU GPL v3</a>.
	</div>
</div>

<div id="crash" class="overlay hidden">
	<h1>원본 게임이 중단되었습니다</h1>
	<pre id="crash-text"></pre>
	<div class="row">
		<button type="button" class="reload-game">다시 시작</button>
		<button class="secondary" id="crash-copy">오류 복사</button>
	</div>
</div>

<div id="closed" class="overlay hidden">
	<h1>원본 게임을 종료했습니다</h1>
	<div class="credits">Your progress has been saved.</div>
	<button type="button" class="reload-game">다시 시작</button>
</div>

<noscript>Shattered Pixel Dungeon needs JavaScript to run.</noscript>

<script defer src="boot.js" data-build-base="%BUILD_BASE%"></script>
</body>
</html>
