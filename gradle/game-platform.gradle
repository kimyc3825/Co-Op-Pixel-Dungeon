allprojects {
    ext {
        appName = 'Noxac Pixel Dungeon'
        appPackageName = 'com.noxac.pixeldungeon'

        // Save compatibility follows the imported game version.
        appVersionCode = 922
        appVersionName = '4.0.2'
        appJavaCompatibility = JavaVersion.VERSION_11
        gdxVersion = '1.14.0'
        gdxControllersVersion = '2.2.4'
    }
    version = appVersionName
    repositories {
        mavenCentral()
    }
}
